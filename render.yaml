services:
  - type: web
    name: habitism-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: PORT
        value: 10000
      - key: FB_PAGE_ID
        value: 1496888330165860
      - key: FB_ACCESS_TOKEN
        sync: false

