<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HABITISM • Log In</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
  <style>
    /* Flower bouquet positioned on the right side */
    .flowers {
      position: absolute;
      left: 70%;
      bottom: 0;
      transform: scale(0.9);
      pointer-events: none;
      z-index: 10;
    }

    .login-wrapper {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      right: 40%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      gap: 18px;
      z-index: 1002;
      overflow-y: auto;
    }

    .login-card {
      width: 92%;
      max-width: 480px;
      background: rgba(18, 14, 38, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 28px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(168, 85, 247, 0.18) inset;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px;
      border-radius: 12px;
    }

    .auth-tab {
      flex: 1;
      padding: 8px 12px;
      border-radius: 9px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-tab.active {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-indigo));
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(147, 51, 234, 0.35);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 4px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.86rem;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: 0.01em;
    }

    .form-group input {
      width: 100%;
      padding: 11px 15px;
      font-size: 0.95rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-group input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #a855f7;
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.25);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #9333ea 0%, #6366f1 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(147, 51, 234, 0.45);
      transition: all 0.22s ease;
      margin-top: 4px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(147, 51, 234, 0.65);
      filter: brightness(1.1);
    }

    
    /* Role selection & demo chips */
    .role-selector-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 4px 0 8px 0;
    }

    .role-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      font-weight: 700;
    }

    .role-pills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .role-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #cbd5e1;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .role-pill:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(168, 85, 247, 0.4);
    }

    .role-pill.active {
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.35) 0%, rgba(99, 102, 241, 0.35) 100%);
      border-color: #a855f7;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.35);
    }

    .quick-fill-row {
      background: rgba(15, 23, 42, 0.65);
      border: 1px dashed rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }

    .quick-fill-label {
      font-size: 0.76rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .demo-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .demo-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-chip:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .demo-chip.demo-chip-admin:hover {
      background: rgba(245, 158, 11, 0.25);
      border-color: #f59e0b;
      color: #f59e0b;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(147, 51, 234, 0.25);
    }

    .auth-error {
      color: #f87171;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    @media (max-width: 768px) {
      .flowers {
        left: 50%;
        transform: scale(0.72);
      }
      .login-wrapper {
        left: 0;
        right: 0;
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>

        </div>
      </div>

      <div class="auth-error" id="authError"></div>

      <!-- Auth Form -->
      <form id="authForm" onsubmit="handleAuthSubmit(event)">

          <label for="authIdentifier">Username or Email</label>
          <input type="text" id="authIdentifier" required placeholder="Enter username or email" autocomplete="username">
        </div>

        <div class="form-group">

          </div>
          <input type="password" id="authPassword" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" class="btn-submit" id="btnSubmitText">Log In as User</button>
      </form>

        Don't have an account? <a href="signup.html" style="color: #38bdf8; font-weight: 700; text-decoration: none;">Sign Up here &rarr;</a>

  <!-- Forgot Password Modal -->
  <div id="forgotPasswordModal" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin: 0; font-size: 1.15rem; color: #fff;">🔑 Reset Password</h3>
        <button type="button" onclick="closeForgotModal()" style="background: none; border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer; line-height: 1;">&times;</button>
      </div>
      <p style="font-size: 0.85rem; color: #94a3b8; margin: 0 0 16px 0;">Enter your registered username or email and your new password.</p>
      
      <form onsubmit="handleForgotPasswordSubmit(event)">
        <div class="form-group" style="margin-bottom: 12px;">
          <label>Username or Email</label>
          <input type="text" id="forgotIdentifier" required placeholder="e.g. user or user@habitism.app">
        </div>
        <div class="form-group" style="margin-bottom: 14px;">
          <label>New Password</label>
          <input type="password" id="forgotNewPassword" required minlength="4" placeholder="Enter new password (min 4 chars)">
        </div>
        <div id="forgotMsg" style="font-size: 0.84rem; margin-bottom: 12px; display: none;"></div>
        <div style="display: flex; gap: 8px; justify-content: flex-end;">
          <button type="button" onclick="closeForgotModal()" style="padding: 8px 14px; border-radius: 8px; background: rgba(255,255,255,0.08); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.15); cursor: pointer;">Cancel</button>
          <button type="submit" class="btn-submit" style="width: auto; padding: 8px 18px; margin: 0;">Update Password</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    window.addEventListener("load", () => {
      document.body.classList.remove("container");
    });

    let currentSelectedRole = 'user';

    function selectRole(role) {
      currentSelectedRole = role;
      document.getElementById('roleUserBtn').classList.toggle('active', role === 'user');
      document.getElementById('roleAdminBtn').classList.toggle('active', role === 'admin');
      
      const submitBtn = document.getElementById('btnSubmitText');
      if (role === 'admin') {
        submitBtn.innerText = 'Log In as Administrator';
        submitBtn.style.background = 'linear-gradient(135deg, #d97706 0%, #b45309 100%)';
      } else {
        submitBtn.innerText = 'Log In as User';
        submitBtn.style.background = 'linear-gradient(135deg, #9333ea 0%, #6366f1 100%)';
      }
    }

    function fillCredentials(username, password) {
      document.getElementById('authIdentifier').value = username;
      document.getElementById('authPassword').value = password;
      selectRole(username === 'admin' ? 'admin' : 'user');
    }

    function openForgotModal() {
      document.getElementById('forgotPasswordModal').style.display = 'flex';
      document.getElementById('forgotMsg').style.display = 'none';
      const curr = document.getElementById('authIdentifier').value.trim();
      if (curr) document.getElementById('forgotIdentifier').value = curr;
    }

    function closeForgotModal() {
      document.getElementById('forgotPasswordModal').style.display = 'none';
    }

    async function handleForgotPasswordSubmit(e) {
      e.preventDefault();
      const identifier = document.getElementById('forgotIdentifier').value.trim();
      const newPassword = document.getElementById('forgotNewPassword').value;
      const msgEl = document.getElementById('forgotMsg');
      
      try {
        const res = await Habitism.forgotPassword(identifier, newPassword);
        msgEl.style.color = '#34d399';
        msgEl.innerText = res.message || 'Password successfully updated! You can now log in.';
        msgEl.style.display = 'block';
        setTimeout(() => {
          closeForgotModal();
          document.getElementById('authIdentifier').value = identifier;
          document.getElementById('authPassword').value = newPassword;
        }, 1500);
      } catch (err) {
        msgEl.style.color = '#f87171';
        msgEl.innerText = err.message || 'Password reset failed.';
        msgEl.style.display = 'block';
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const identifier = document.getElementById('authIdentifier').value.trim();
      const password = document.getElementById('authPassword').value;
      const errEl = document.getElementById('authError');
      errEl.style.display = 'none';

      try {
        const user = await Habitism.login(identifier, password);
        
        // Routing based on role and commitment
        if (user.role === 'admin') {
          window.location.href = 'admin.html';
        } else if (user.committed) {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'rules.html';
        }
      } catch (err) {
        errEl.innerText = err.message || 'Invalid username/email or password.';
        errEl.style.display = 'block';
      }
    }

    async function handleFacebookLogin() {
      const fbName = prompt('Enter your Facebook profile name for verification:', 'Accountability Champion') || 'Facebook User';
      const user = await Habitism.facebookLogin(fbName);
      
      if (user.role === 'admin') {
        window.location.href = 'admin.html';
      } else if (!user.committed) {
        window.location.href = 'rules.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
